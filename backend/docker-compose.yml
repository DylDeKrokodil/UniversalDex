services:
  postgres:
    image: postgres:17-alpine
    container_name: universaldex-postgres
    environment:
      POSTGRES_DB: universaldex
      POSTGRES_USER: universaldex
      POSTGRES_PASSWORD: universaldex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universaldex -d universaldex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
